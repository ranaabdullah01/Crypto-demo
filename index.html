<script>
(function () {
    const API_BASE = "https://YOUR-WORKER-SUBDOMAIN.workers.dev";

    const loginOverlay = document.getElementById('loginOverlay');
    const mainApp = document.getElementById('mainApp');
    const loginUsername = document.getElementById('loginUsername');
    const loginPassword = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const forgotLink = document.getElementById('forgotLink');
    const forgotModal = document.getElementById('forgotModal');
    const masterPassword = document.getElementById('masterPassword');
    const newUsername = document.getElementById('newUsername');
    const newPassword = document.getElementById('newPassword');
    const resetConfirmBtn = document.getElementById('resetConfirmBtn');
    const resetCancelBtn = document.getElementById('resetCancelBtn');
    const forgotError = document.getElementById('forgotError');
    const forgotSuccess = document.getElementById('forgotSuccess');
    const displayUsername = document.getElementById('displayUsername');
    const logoutBtn = document.getElementById('logoutBtn');

    const livePriceEl = document.getElementById('livePrice');
    const signalDisplay = document.getElementById('signalDisplay');
    const candleGrid = document.getElementById('candleGrid');
    const historyList = document.getElementById('historyList');
    const winCountEl = document.getElementById('winCount');
    const lossCountEl = document.getElementById('lossCount');
    const strategyHint = document.getElementById('strategyHint');
    const strategyDisplay = document.getElementById('strategyDisplay');
    const countdownTimerEl = document.getElementById('countdownTimer');
    const liveClockEl = document.getElementById('liveClock24');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    let refreshTimer = null;
    let clockTimer = null;

    function api(path, options = {}) {
        return fetch(API_BASE + path, {
            ...options,
            credentials: "include",
            headers: {
                "Content-Type": "application/json",
                ...(options.headers || {})
            }
        }).then(async response => {
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data.ok === false) {
                throw new Error(data.error || `HTTP ${response.status}`);
            }
            return data;
        });
    }

    function formatTime(timestamp) {
        return new Date(Number(timestamp)).toLocaleTimeString('en-GB', {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        });
    }

    function updateClock() {
        liveClockEl.textContent = new Date().toLocaleTimeString('en-GB', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
        });
    }

    function updateCountdown() {
        const now = new Date();
        const secondsIntoHour = now.getMinutes() * 60 + now.getSeconds();
        const remaining = 900 - (secondsIntoHour % 900);
        const mins = Math.floor(remaining / 60);
        const secs = remaining % 60;
        countdownTimerEl.textContent =
            `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function renderCandles(candles) {
        candleGrid.innerHTML = '';
        candles.forEach(c => {
            const div = document.createElement('div');
            div.className = 'candle-item';
            const colorClass = c.color === 'green' ? 'green' : 'red';
            const arrow = c.color === 'green' ? '▲' : '▼';
            div.innerHTML = `
                <div class="time">${formatTime(c.rawTime)}</div>
                <div class="ohlc ${colorClass}">${arrow} ${Number(c.close).toFixed(2)}</div>
                <div class="open-text">O:${Number(c.open).toFixed(2)}</div>
            `;
            candleGrid.appendChild(div);
        });
    }

    function renderHistory(signals) {
        historyList.innerHTML = '';

        if (!signals.length) {
            historyList.innerHTML =
                '<div style="color:#5a5a62;text-align:center;padding:16px;font-size:16px;">NO TRADES YET</div>';
            return;
        }

        signals.forEach(item => {
            const row = document.createElement('div');
            row.className = 'history-row';

            const badge = item.result === 'WIN'
                ? '<span class="win-badge">WIN</span>'
                : item.result === 'LOSS'
                    ? '<span class="loss-badge">LOSS</span>'
                    : '<span style="color:#888892;">PENDING</span>';

            row.innerHTML = `
                <span class="h-time">${formatTime(item.candle_time)}</span>
                <span style="font-weight:600;">${item.signal}</span>
                <span class="h-price">$${Number(item.entry_price).toFixed(2)}</span>
                <span class="h-result">${badge}</span>
            `;

            historyList.appendChild(row);
        });
    }

    function updateStrategy(strategyName) {
        const name = strategyName || 'HYBRID';
        strategyDisplay.textContent = name === 'HYBRID' ? '⚡ HYBRID' : '🚀 TURBO';
        strategyHint.textContent =
            name === 'HYBRID'
                ? '15M TIMEFRAME · ⚡ HYBRID'
                : '15M TIMEFRAME · 🚀 TURBO';
    }

    function setSignal(signal) {
        signalDisplay.textContent = signal || 'WAITING';
        signalDisplay.className = 'signal-value';

        if (signal === 'BUY') signalDisplay.classList.add('signal-green');
        else if (signal === 'SELL') signalDisplay.classList.add('signal-red');
        else signalDisplay.classList.add('signal-neutral');
    }

    async function refreshBot() {
        try {
            const [status, history] = await Promise.all([
                api('/api/status'),
                api('/api/history?limit=100')
            ]);

            livePriceEl.textContent = Number(status.price).toFixed(2);
            updateStrategy(status.strategyName);

            const currentSignal =
                status.latestSignal?.signal || 'WAITING';

            setSignal(currentSignal);

            renderCandles(status.candles || []);
            renderHistory(history.signals || []);

            winCountEl.textContent = history.wins || 0;
            lossCountEl.textContent = history.losses || 0;

            statusDot.className = 'status-dot active';
            statusText.textContent = 'Active';
        } catch (error) {
            console.error(error);
            statusDot.className = 'status-dot inactive';
            statusText.textContent = 'Backend Error';
        }
    }

    async function login() {
        const username = loginUsername.value.trim();
        const password = loginPassword.value;

        if (!username || !password) {
            loginError.textContent = 'Please enter both username and password.';
            return;
        }

        try {
            await api('/api/login', {
                method: 'POST',
                body: JSON.stringify({ username, password })
            });

            loginError.textContent = '';
            loginOverlay.classList.add('hidden');
            mainApp.style.display = 'block';
            displayUsername.textContent = username;

            await refreshBot();
        } catch (error) {
            loginError.textContent = error.message || 'Login failed.';
        }
    }

    async function logout() {
        try {
            await api('/api/logout', { method: 'POST' });
        } catch (_) {}

        mainApp.style.display = 'none';
        loginOverlay.classList.remove('hidden');
        loginPassword.value = '';
    }

    async function resetHistory() {
        if (!confirm('Reset all stored trading history?')) return;

        try {
            await api('/api/admin/reset-history', {
                method: 'POST'
            });

            await refreshBot();
        } catch (error) {
            alert(error.message || 'Reset failed.');
        }
    }

    loginBtn.addEventListener('click', login);
    loginPassword.addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
    });
    loginUsername.addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
    });

    logoutBtn.addEventListener('click', logout);

    document.getElementById('resetHistoryBtn')
        .addEventListener('click', resetHistory);

    forgotLink.addEventListener('click', () => {
        forgotModal.classList.add('active');
        forgotError.textContent = '';
        forgotSuccess.textContent = '';
    });

    resetCancelBtn.addEventListener('click', () => {
        forgotModal.classList.remove('active');
    });

    resetConfirmBtn.addEventListener('click', async () => {
        forgotError.textContent = '';
        forgotSuccess.textContent = '';

        const master = masterPassword.value;
        const username = newUsername.value.trim();
        const password = newPassword.value;

        try {
            await api('/api/admin/reset-credentials', {
                method: 'POST',
                body: JSON.stringify({
                    masterPassword: master,
                    username,
                    password
                })
            });

            forgotSuccess.textContent =
                'Credentials reset successfully.';

            loginUsername.value = username;
            loginPassword.value = '';

            setTimeout(() => {
                forgotModal.classList.remove('active');
            }, 1200);

        } catch (error) {
            forgotError.textContent =
                error.message || 'Reset failed.';
        }
    });

    clockTimer = setInterval(() => {
        updateClock();
        updateCountdown();
    }, 1000);

    updateClock();
    updateCountdown();

    /*
       Do not run the bot in the browser.
       Cloudflare Cron runs the signal engine.
       This timer only refreshes the display.
    */
    refreshBot();
    refreshTimer = setInterval(refreshBot, 15000);

})();
</script>

</body>
</html>
